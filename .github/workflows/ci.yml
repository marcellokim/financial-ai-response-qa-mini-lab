name: CI

on:
  push:
  pull_request:

jobs:
  demo-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run demo
        run: make clean demo

      - name: Run tests
        run: make test
